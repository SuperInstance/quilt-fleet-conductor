[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-fleet-conductor"
version = "0.1.0"
description = "Orchestrates all Quilt canon tools as a single workflow (explore, publish, verify)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "SuperInstance", email = "[email protected]"}]
keywords = ["conductor", "orchestrator", "canon", "quilt", "fleet", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
quilt-fleet-conductor = "quilt_fleet_conductor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quilt_fleet_conductor*"]
